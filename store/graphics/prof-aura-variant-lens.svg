<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision" role="img" aria-labelledby="lens-title lens-description">
  <title id="lens-title">Prof. Aura — Quiet Lens</title>
  <desc id="lens-description">A calm luminous lens shape holding a single bright core.</desc>
  <defs>
    <linearGradient id="lens-bg" x1="44" y1="48" x2="468" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182C" />
      <stop offset="0.52" stop-color="#102950" />
      <stop offset="1" stop-color="#27133F" />
    </linearGradient>
    <linearGradient id="lens-mark" x1="116" y1="354" x2="410" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62F0FF" />
      <stop offset="0.47" stop-color="#86A0FF" />
      <stop offset="0.78" stop-color="#C994FF" />
      <stop offset="1" stop-color="#FFA5D1" />
    </linearGradient>
    <radialGradient id="lens-core" cx="32%" cy="24%" r="80%">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.5" stop-color="#ECFEFF" />
      <stop offset="1" stop-color="#7DEBFF" />
    </radialGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="60%">
      <stop stop-color="#4FDFFF" stop-opacity="0.22" />
      <stop offset="0.54" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="1" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <filter id="lens-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="lens-core-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#lens-bg)" />
  <ellipse cx="256" cy="256" rx="197" ry="181" fill="url(#lens-glow)" filter="url(#lens-blur)" />

  <!-- A restrained almond lens: calm, observant, and readable as one shape at 16px. -->
  <path d="M93 256C131 160 193 108 256 108C319 108 381 160 419 256C381 352 319 404 256 404C193 404 131 352 93 256Z" fill="none" stroke="url(#lens-mark)" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" filter="url(#lens-blur)" />
  <path d="M93 256C131 160 193 108 256 108C319 108 381 160 419 256C381 352 319 404 256 404C193 404 131 352 93 256Z" fill="none" stroke="url(#lens-mark)" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" />

  <circle cx="256" cy="256" r="43" fill="#78ECFF" opacity="0.22" filter="url(#lens-core-blur)" />
  <circle cx="256" cy="256" r="26" fill="url(#lens-core)" />
  <circle cx="247" cy="247" r="7" fill="#FFFFFF" opacity="0.9" />
</svg>
