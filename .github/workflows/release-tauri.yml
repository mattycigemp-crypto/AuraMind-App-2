name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS Silicon + Intel cross compile / universal
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './auramind-gemini/src-tauri -> target'

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "No extra system libs needed for macOS Tauri build typically"

      - name: Install frontend dependencies
        run: |
          cd auramind-gemini
          npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with version from tauri.conf.json
          releaseName: 'AuraMind v__VERSION__'
          releaseBody: 'See the assets below to download the latest native desktop version of AuraMind.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './auramind-gemini'
