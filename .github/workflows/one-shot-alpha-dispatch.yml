# TEMPORARY - delete this file after 2026-09-09.
#
# Dispatches the real Android workflow at the alpha (closed testing) track on
# 2026-09-09, so the first upload on the new Play upload key happens without
# anyone needing to be awake for it.
#
# WHY 09:30 UTC AND NOT 05:00
#
# The key's activation time was recorded as "~04:45 on 2026-09-09" without a
# timezone that was ever confirmed. The repo owner is US Eastern (UTC-4 in
# September), so that could mean 04:45 UTC or 08:45 UTC. Firing at 05:00 UTC
# is only correct under the first reading; under the second it hits the old
# key and fails overnight with nobody watching.
#
# 09:30 UTC (05:30 Eastern) is after both candidate activation times, so it is
# correct either way. The cost is a few hours of delay while the owner is
# asleep, against the risk of a silent overnight failure - an easy trade.
#
# Why a workflow rather than a scheduled cloud agent: a cloud routine needs a
# connected GitHub account, which is not set up for this repo. GITHUB_TOKEN
# with `actions: write` can dispatch a sibling workflow with no external auth.
#
# Two things to know:
#   * Scheduled workflows only run on the default branch, which is main. Fine here.
#   * GitHub can delay scheduled runs by 15+ minutes under load. The 15-minute
#     buffer after key activation absorbs the normal case; a longer delay only
#     makes the upload later, never wrong.
#
# The cron is day-of-month 9, month 9, so if this file is still here in
# September 2027 it fires again. That is why it says delete after the date.

name: One-shot alpha dispatch (temporary)

on:
  schedule:
    - cron: '30 9 9 9 *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Mobile Android at the alpha track
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run mobile-android.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f track=alpha
          echo "Dispatched mobile-android.yml with track=alpha"
