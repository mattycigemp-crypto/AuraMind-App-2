name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS Silicon + Intel cross compile / universal
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-latest'
            args: '--target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auramind-gemini/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu' || '') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './auramind-gemini/src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: |
          cd auramind-gemini
          npm ci

      # Apple notarization requires three secrets:
      #   APPLE_CERTIFICATE          — base64 of the Developer ID
      #                                 Application .p12 cert
      #   APPLE_CERTIFICATE_PASSWORD — the .p12 export password
      #   APPLE_SIGNING_IDENTITY     — "Developer ID Application: CogniVect, Inc. (TEAMID)"
      # If any of these are missing on a macos-latest run, tauri-action
      # signs-but-doesn't-notarize; the build still succeeds but Gatekeeper
      # will warn users on first launch. See docs/M6-store-submission-playbook.md.

      # Windows EV/AZ Trusted Signing requires:
      #   WINDOWS_CERTIFICATE          — base64 of the code-signing .pfx
      #   WINDOWS_CERTIFICATE_PASSWORD — the .pfx password
      # When absent, tauri-action builds a working binary that SmartScreen
      # will flag until you sign. Universe the smartScreen warning only on
      # production cuts; the dev release will skip signing.

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (the .key file as base64 + its password).
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Apple notarization (macos-latest only — ignored on Windows/Linux runners).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows code-signing (windows-latest only — ignored elsewhere).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with version from tauri.conf.json
          releaseName: 'AuraMind v__VERSION__ — by CogniVect, Inc.'
          releaseBody: 'See the assets below to download the latest native desktop version of AuraMind, a study platform by CogniVect, Inc. (cognitive · vector). Visit https://cogniavect.app for the broader product family.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './auramind-gemini'
