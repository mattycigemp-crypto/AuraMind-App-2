<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0A0A0F"/>

  <!-- Pulsing synapse dot at apex -->
  <circle cx="32" cy="14" r="3.5" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- A monogram (geometric) -->
  <path d="M20 48 L32 22 L44 48 M25 40 L39 40" stroke="#F0EFFE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- Radiating synapse lines (animated opacity) -->
  <g stroke="#8B5CF6" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="32" y1="14" x2="18" y2="8">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0s"/>
    </line>
    <line x1="32" y1="14" x2="46" y2="8">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="32" y1="14" x2="14" y2="20">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="32" y1="14" x2="50" y2="20">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </line>
  </g>
</svg>
