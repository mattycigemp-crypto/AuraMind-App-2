<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="315" rx="500" ry="400" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="630" x2="1200" y2="630" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Brand -->
  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#6366f1" letter-spacing="8">AURAMIND</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-2">LEARN HALF</text>
  <text x="80" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#6366f1" letter-spacing="-2">THE TIME</text>
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-2">RETAIN MORE</text>

  <!-- Tagline -->
  <text x="80" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#71717a" letter-spacing="2">AI-POWERED FLASHCARDS WITH FSRS SPACED REPETITION</text>

  <!-- Bottom bar -->
  <rect x="80" y="565" width="300" height="2" fill="#6366f1" opacity="0.5"/>
  <text x="80" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#52525b" letter-spacing="3">auramind.app</text>
</svg>
